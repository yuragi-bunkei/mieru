<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>mieru — STLライブビューア</title>
<style>
  html, body { margin: 0; height: 100%; background: #1a1d21; color: #e8e8e8; font-family: -apple-system, "Hiragino Sans", sans-serif; }
  #app { display: flex; height: 100%; }
  #sidebar { width: 230px; flex: none; background: #23272d; padding: 12px; overflow-y: auto; font-size: 13px; box-sizing: border-box; }
  #sidebar h1 { font-size: 14px; margin: 0 0 10px; }
  #filelist label { display: flex; align-items: center; gap: 6px; padding: 3px 0; cursor: pointer; word-break: break-all; }
  .swatch { width: 10px; height: 10px; border-radius: 2px; flex: none; }
  .err { color: #ffb454; }
  #canvas-wrap { flex: 1; position: relative; min-width: 0; }
  canvas { display: block; }
  #gl { position: absolute; inset: 0; z-index: 1; }
  #views { position: absolute; inset: 0; z-index: 2; display: grid; gap: 3px; }
  #views.n1 { grid-template-columns: 1fr; }
  #views.n2 { grid-template-columns: 1fr 1fr; }
  #views.n4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
  .view { position: relative; }
  .view.drawing { outline: 2px solid #ff5252; outline-offset: -2px; }
  .view.drawing .view-label { color: #ff5252; }
  .view-label { position: absolute; left: 8px; top: 6px; font-size: 12px; color: #9aa0a6;
    background: rgba(0,0,0,.4); padding: 1px 6px; border-radius: 4px; pointer-events: none; }
  #views.n1 .view-label { display: none; }
  #anno { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
  #anno.active { pointer-events: auto; cursor: crosshair; }
  #anno-hint { font-size: 11px; color: #9aa0a6; margin-top: 4px; }
  .anno-input { position: absolute; z-index: 6; background: #23272d; color: #ff5252;
    border: 1px solid #ff5252; font-size: 15px; padding: 2px 4px; }
  #dims { position: absolute; left: 10px; bottom: 10px; background: rgba(0,0,0,.55); padding: 6px 10px; border-radius: 6px; font-size: 13px; pointer-events: none; z-index: 6; }
  #status { position: absolute; right: 10px; top: 10px; font-size: 12px; color: #9aa0a6; pointer-events: none; z-index: 6; }
  .ctl { margin-top: 14px; border-top: 1px solid #3a3f46; padding-top: 10px; }
  .ctl label { display: flex; align-items: center; gap: 6px; margin: 6px 0; }
  button { background: #3a3f46; color: #e8e8e8; border: 0; border-radius: 5px; padding: 6px 10px; cursor: pointer; }
  select, input[type=range] { width: 100%; }
</style>
<script type="importmap">
{ "imports": {
  "three": "/vendor/three/build/three.module.js",
  "three/addons/": "/vendor/three/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <h1>mieru</h1>
    <div id="filelist">（STL待機中…）</div>
    <div class="ctl">
      <div>ビュー数</div>
      <select id="viewcount">
        <option value="1">1画面</option>
        <option value="2">2画面</option>
        <option value="4">4画面</option>
      </select>
    </div>
    <div class="ctl">
      <button id="fit">全体表示</button>
      <button id="resetview">視点リセット</button>
      <label><input type="checkbox" id="wire"> ワイヤーフレーム</label>
      <label><input type="checkbox" id="plate" checked> ビルドプレート (180mm)</label>
      <label><input type="checkbox" id="axes" checked> 座標軸</label>
      <label><input type="checkbox" id="autorot"> 自動回転</label>
    </div>
    <div class="ctl">
      <div>断面</div>
      <select id="clip-axis">
        <option value="">なし</option>
        <option value="x">X</option>
        <option value="y">Y</option>
        <option value="z">Z</option>
      </select>
      <input type="range" id="clip-pos" min="0" max="100" value="100">
    </div>
    <div class="ctl">
      <div>描き込み（Claudeへの指示）</div>
      <label><input type="checkbox" id="anno-mode"> 描き込みモード</label>
      <select id="anno-tool">
        <option value="pen">ペン</option>
        <option value="arrow">矢印</option>
        <option value="text">文字</option>
      </select>
      <button id="anno-clear">消去</button>
      <div id="anno-hint">描いたらClaudeに「画面を見て」と伝えてください</div>
    </div>
  </div>
  <div id="canvas-wrap">
    <div id="views"></div>
    <canvas id="anno"></canvas>
    <div id="dims">—</div>
    <div id="status">接続中…</div>
  </div>
</div>
<script type="module" src="/viewer.js"></script>
<script src="/annotate.js"></script>
</body>
</html>
